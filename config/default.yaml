# Bump config_version whenever a key is renamed or removed, so the app can detect
# and warn about an old-format config file rather than silently misreading it.
config_version: 1

video:
  sample_fps: 1
  scene_threshold: 27.0

ocr:
  engine: tesseract
  scoreboard_region:
    x: 0.05
    y: 0.82
    width: 0.90
    height: 0.15
  preprocess:
    grayscale: true
    threshold: true
    upscale: 2
  min_confidence: 0.70

replay:
  confidence_threshold: 0.65
  min_segment_seconds: 3
  # Optional reference image for the replay-logo/bumper-graphic signal (specs/004-replay-detection/).
  # When unset, that one signal always scores 0.0 rather than blocking detection.
  logo_template_path: null
  signals:
    replay_logo_weight: 0.35
    scoreboard_absence_weight: 0.20
    motion_profile_weight: 0.20
    transition_weight: 0.15
    camera_angle_weight: 0.10

events:
  pre_roll_seconds: 8
  post_roll_seconds: 12
  merge_gap_seconds: 3
  # TEAM_MILESTONE fires each time the batting team's runs total crosses a
  # multiple of this interval (specs/007-event-detection/spec.md FR-008).
  team_milestone_interval: 50
  # Only event types Module 5 (Event Detection) can currently emit.
  # Do NOT add HAT_TRICK, MATCH_WINNING_SHOT, RUN_OUT, CATCH, or GREAT_FIELDING
  # back here until a dismissal-type/fielder-attribution data source is designed
  # (see specs/technical_plan.md "Event Taxonomy & Detectability") -- their
  # presence previously implied detectability the pipeline doesn't have.
  # Do NOT add FIFTY or CENTURY back here either until per-batter running-score
  # extraction exists -- Module 4/4a only ever provide the team total, not an
  # individual batter's own score, so these two cannot currently be derived
  # (see specs/technical_plan.md "Event Taxonomy & Detectability").
  ranking:
    WICKET: 95
    SIX: 80
    TEAM_MILESTONE: 65
    FOUR: 60

output:
  container: mp4
  avoid_reencode: true

# Bump config_version whenever a key is renamed or removed, so the app can detect
# and warn about an old-format config file rather than silently misreading it.
config_version: 1

video:
  sample_fps: 1
  # Post-implementation amendment (specs/003-scene-detection/research.md
  # "Detector selection" note) -- full rationale below.
  #
  # WHY AdaptiveDetector, not ContentDetector: real-video validation (a
  # 3h10m club match) found PySceneDetect's original ContentDetector -- one
  # fixed cut-score threshold, applied uniformly across the whole video --
  # could not be made to work at all. The video's own "how different do two
  # consecutive frames look" scale varies enormously *within a single
  # match*: max observed score ~5.7 during calm pre-match/toss footage vs.
  # ~95-97 during active play (measured via three independent 3-minute
  # samples: opening, mid-innings, late-innings). No single fixed number is
  # simultaneously correct for both regimes -- a value low enough to catch
  # real cuts during calm footage (e.g. 3.0) produced hundreds of spurious
  # boundaries once play started; a value that behaved reasonably during
  # play (e.g. 20.0) found essentially nothing during calm footage.
  # AdaptiveDetector compares each frame against a small rolling window of
  # its own immediate neighbors instead of one global constant, so it
  # self-adjusts to whichever regime the footage is currently in --
  # confirmed empirically: 0 boundaries on calm footage, a consistent,
  # well-spaced count on active footage, using the SAME parameters for
  # both, with no manual per-video retuning required.
  #
  # WHY the adaptive ratio stays at PySceneDetect's own published default
  # (3.0, not exposed as a separate config key): it is a scale-invariant
  # ratio ("how many times more different than this frame's own
  # neighborhood"), not an absolute score -- real-video testing found no
  # evidence it needs overriding, and changing it was not part of what
  # made detection work here.
  #
  # WHY scene_threshold (AdaptiveDetector's min_content_val) is the only
  # calibrated parameter: it's a noise floor, not the primary cut decision
  # -- a frame must BOTH clear this floor AND exceed the adaptive ratio
  # above to register as a cut. Its only job is stopping the ratio math
  # from firing on near-zero fluctuations (e.g. a locally-static scene
  # where even tiny noise looks like "3x the neighborhood average" in
  # relative terms despite being visually meaningless in absolute terms).
  #
  # WHY 8.0: PySceneDetect's own library default (15.0) sat almost exactly
  # at the 99th percentile of this video's own active-play score
  # distribution -- filtering out all but the most extreme 1% of frames,
  # which is why it under-detected (2 boundaries per 3-minute active
  # sample). Testing 3.0/5.0/8.0 against two independent active-play
  # samples found 8.0 the best match to a hand-verified "reasonable cut
  # rate" (~7 and ~4 boundaries per 3-minute sample, close to
  # manually-tuned ContentDetector(threshold=20.0)'s own result on the
  # same samples) while remaining comfortably above the calm-footage max
  # of ~5.7, so pre-match footage still correctly yields ~0 boundaries.
  #
  # EXPECTED SYMPTOMS if this needs revisiting on different footage: too
  # LOW -- many boundaries clustered within a second or two of each other
  # (compression noise/motion blur being mistaken for cuts, most visible
  # during active play); too HIGH -- few or no boundaries even during
  # clearly active footage (real cuts failing to clear the floor,
  # reproducing the original ContentDetector failure this replaces).
  #
  # WHY this is expected to generalize better than a single global
  # threshold: min_content_val only has to be "low enough not to miss real
  # cuts, high enough to reject noise" -- a much coarser, more forgiving
  # bar than "the one number that correctly separates every cut from every
  # non-cut in the whole video," which is what the old ContentDetector
  # threshold had to be and demonstrably could not be. Getting this floor
  # somewhat wrong on a differently-shot broadcast degrades gracefully
  # (moderately more or fewer boundaries), rather than catastrophically
  # (zero, or hundreds) the way the old fixed-threshold design did.
  #
  # NOT YET DONE, DELIBERATELY: automatic per-video calibration of this
  # value. Rejected for now, not as a permanent decision -- with only one
  # real match video validated, there is no evidence a fixed default fails
  # to generalize, and building calibration logic to solve a problem that
  # hasn't been demonstrated would be premature complexity (this
  # platform's own constitution favors the simplest solution that meets
  # the bar). Revisit with real evidence once 2+ independent match videos
  # (different broadcasters/tournaments/production styles) have been
  # validated against this same value.
  scene_threshold: 8.0

ocr:
  engine: tesseract
  scoreboard_region:
    x: 0.05
    y: 0.82
    width: 0.90
    height: 0.15
  preprocess:
    grayscale: true
    threshold: true
    upscale: 2
  min_confidence: 0.70

replay:
  # Calibrated against real footage (First8Overs.mp4): with no logo template
  # configured (the common case -- see logo_template_path below) and this
  # broadcast's hard, non-ramping cuts into replay (Scene Detection's
  # REPLAY_TRANSITION heuristic didn't fire), the original weights
  # (logo=0.35, transition=0.15) left a max achievable combined confidence
  # of 0.50-0.65 depending on scenario -- at or below the original
  # threshold (0.65), making detection mathematically unreachable rather
  # than merely insensitive. Rebalanced so logo/transition remain
  # meaningful when actually available, without being able to single-
  # handedly gate detection: scoreboard+motion+camera_angle alone (the
  # three signals that work without a template or a ramping cut) now have
  # a 0.65 ceiling, comfortably above the lowered threshold. A reasoned
  # recalibration from two hand-verified samples, not exhaustively tuned --
  # revisit if other footage shows it's still wrong.
  confidence_threshold: 0.50
  min_segment_seconds: 3
  # Optional reference image for the replay-logo/bumper-graphic signal (specs/004-replay-detection/).
  # When unset, that one signal always scores 0.0 rather than blocking detection.
  logo_template_path: null
  signals:
    replay_logo_weight: 0.15
    scoreboard_absence_weight: 0.25
    motion_profile_weight: 0.25
    transition_weight: 0.20
    camera_angle_weight: 0.15

events:
  # Calibrated against real match footage (First8Overs.mp4, WICKET and SIX
  # events cross-checked by hand): the on-screen scoreboard graphic does not
  # update until the broadcast cuts back from its post-event replay, so the
  # OCR-detected event timestamp lags the actual live delivery by ~15s.
  # Bowler run-up consistently begins ~30-35s before the detected timestamp;
  # the replay consistently finishes within ~0-10s after it. pre_roll is set
  # generously above the observed run-up lag to make sure this holds for
  # longer run-ups too; post_roll keeps a small margin above the observed
  # replay-completion point. A reasoned calibration from two samples, not an
  # exhaustively tuned value -- revisit if other footage shows it's wrong.
  pre_roll_seconds: 35
  post_roll_seconds: 15
  merge_gap_seconds: 3
  # TEAM_MILESTONE fires each time the batting team's runs total crosses a
  # multiple of this interval (specs/007-event-detection/spec.md FR-008).
  team_milestone_interval: 50
  # Only event types Module 5 (Event Detection) can currently emit.
  # Do NOT add HAT_TRICK, MATCH_WINNING_SHOT, RUN_OUT, CATCH, or GREAT_FIELDING
  # back here until a dismissal-type/fielder-attribution data source is designed
  # (see specs/technical_plan.md "Event Taxonomy & Detectability") -- their
  # presence previously implied detectability the pipeline doesn't have.
  # Do NOT add FIFTY or CENTURY back here either until per-batter running-score
  # extraction exists -- Module 4/4a only ever provide the team total, not an
  # individual batter's own score, so these two cannot currently be derived
  # (see specs/technical_plan.md "Event Taxonomy & Detectability").
  ranking:
    WICKET: 95
    SIX: 80
    TEAM_MILESTONE: 65
    FOUR: 60

metadata:
  # Anchor Validation (specs/014-anchor-validation): before this feature, the
  # metadata-to-video-timestamp aligner committed to the nearest scoreboard
  # reading unconditionally -- real validation against the Wild Wanderers vs
  # Phoenix Firehawks match found this produced confidently-WRONG timestamps
  # (not just missed events) when OCR quality was poor: 6 of 33
  # commentary-recovered events landed out of chronological order, one
  # anchored 35 minutes away from its true position. These thresholds gate
  # whether a candidate scoreboard reading is trustworthy enough to accept.
  #
  # NOTE: not currently read from this file at runtime -- align()'s own
  # AnchorValidationConfig dataclass (src/cvip/metadata/anchor_validation_models.py)
  # carries these same values as its Python defaults, following this
  # pipeline's own established precedent (align()'s ball_radius/
  # match_window_seconds parameters are likewise hardcoded defaults, never
  # wired from this file). This block exists as the documented source of
  # truth for those defaults and the calibration reasoning behind them, and
  # as the future wiring point if a per-broadcast override is ever needed.
  anchor_validation:
    # WHY these values (revised after real-data validation against the Wild
    # Wanderers vs Phoenix Firehawks match -- see anchor_validation.py's
    # classify_tier() docstring for the full self-caught-correction writeup):
    # an earlier calibration (0.70/0.50/0.35, naively reusing ocr.min_confidence
    # above as the "high" bar) was checked against real data and found
    # broken -- raw OCR confidence on this broadcast is uniformly low
    # (median 0.35 among even smoother-VALIDATED readings; 89% below 0.50)
    # regardless of whether the reading was ultimately correct or wrong.
    # That calibration hard-rejected roughly half of even the trustworthy
    # data and left MEDIUM tier practically unreachable, producing ZERO
    # recoverable events on a real match -- the opposite of the intended
    # "fewer highlights, but correct" outcome. Crucially, raw OCR confidence
    # was never what distinguished this match's 6 actually-wrong anchors
    # from its 27 correct ones anyway (both shared the same 0.27-0.47
    # range) -- `ordering` is what catches wrong anchors (proven:
    # `ordering_violations_prevented=28` on a real re-run), so OCR quality
    # only needs to gate truly-unreadable frames, not act as the primary
    # correctness signal.
    #
    # ocr_confidence_high: a candidate at or above this needs no other
    # corroboration to reach HIGH tier -- kept close to ocr.min_confidence
    # above (Scoreboard OCR's own "reliable" bar) since SOME frames on a
    # good broadcast do reach it, but not required for automatic recovery.
    ocr_confidence_high: 0.60
    # ocr_confidence_medium: below this, OCR quality counts as one
    # "downgrade" toward MEDIUM tier rather than disqualifying a candidate
    # outright -- calibrated to sit near the real median (0.349) observed
    # on a broadcast with this good/poor OCR profile, so a validated,
    # exact-ball, chronologically-consistent reading can still reach
    # MEDIUM (and remain auto-recovery-eligible) even with typical-for-this-
    # broadcast OCR quality.
    ocr_confidence_medium: 0.35
    # ocr_confidence_low: the hard floor -- below this, a candidate is
    # INSUFFICIENT and hard-rejected regardless of corroboration. Set low
    # enough (real validated-reading minimum observed: 0.151) that it only
    # catches genuinely unreadable/near-blank frames, not merely
    # below-average ones on an already-poor broadcast.
    ocr_confidence_low: 0.15
    # WHY 5.0: a candidate's implied seconds-per-ball pace is judged
    # WITHIN_EXPECTED when it falls within this multiplicative factor of the
    # innings' own recently observed pace (WITHIN_EXPECTED if
    # 1/tolerance <= ratio <= tolerance) -- generous enough to tolerate a real
    # over break, bowling change, or wicket celebration without flagging it,
    # while still catching an order-of-magnitude-wrong candidate. This is a
    # soft signal only (downgrades the confidence tier, never hard-rejects on
    # its own) -- see research.md Decision 3.
    #
    # Self-caught recalibration (specs/016 follow-on investigation, real
    # ww_vs_pf data): the original value of 3.0 was picked without checking
    # the actual observed ratio distribution. On this match, all 33
    # already-trusted WITHIN_EXPECTED candidates span ratio 0.378-2.974, but
    # 4 real, otherwise-completely-clean boundaries (e.g. metadata's 5.3,
    # 6.2, 19.2) landed just outside that band at 3.09-3.965 and were being
    # excluded purely on this marginal miss -- while the next-nearest
    # genuinely anomalous candidates don't appear until ratio 11.9. 5.0
    # covers the real marginal cluster with headroom, while staying more
    # than 2x below the anomalous cluster's floor.
    neighbor_pacing_tolerance: 5.0

output:
  container: mp4
  avoid_reencode: true

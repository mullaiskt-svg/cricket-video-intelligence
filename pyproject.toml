[project]
name = "cvip"
version = "0.1.0"
description = "Cricket Video Intelligence Platform - offline cricket match analysis and highlight generation"
requires-python = ">=3.11"

[project.scripts]
cvip = "cvip.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/contract", "tests/integration", "tests/benchmark"]
pythonpath = ["src"]
# Benchmark tests (tests/benchmark/) are real-time/real-memory measurements
# against multi-hour synthetic fixtures and take tens of minutes combined --
# deselected by default so `pytest` and the coverage gate stay fast. Run them
# explicitly with `pytest -m benchmark` (the trailing -m on the command line
# overrides this addopts default, it does not combine with it).
addopts = '--strict-markers -m "not benchmark"'
markers = [
    "benchmark: slow, real-fixture performance/throughput/memory-regression tests (deselected by default; run explicitly with `pytest -m benchmark`)",
]

[tool.coverage.run]
source = ["src/cvip"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true

[tool.pylint.format]
max-line-length = 100
